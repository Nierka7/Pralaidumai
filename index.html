<style>
  :root {

    --bg2:       #161b27;
    --border:    #2a3650;
    --border2:   #1e2535;
    --text:      #e0e0e0;
    --text2:     #c8d8f0;
    --muted:     #7a90b0;
    --accent:    #4fc3f7;
    --row-hover: #1e2a40;
    --row-active:#1a3050;
    --btn-bg:    #0f1117;
    --btn-active:#1a3050;
    --search-bg: #0f1117;
    --popup-bg:  #161b27;
    --shadow:    rgba(0,0,0,0.6);
    --marker-stroke: #fff;
  }
  body.light {
    --bg:        #f0f4f8;
    --bg2:       #ffffff;
    --border:    #c5d3e0;
    --border2:   #dce6ef;
    --text:      #1a2535;
    --text2:     #1e3050;
    --muted:     #6080a0;
    --accent:    #1a6fa8;
    --row-hover: #e4eef7;
    --row-active:#cce0f5;
    --btn-bg:    #f0f4f8;
    --btn-active:#cce0f5;
    --search-bg: #f8fbff;
    --popup-bg:  #ffffff;
    --shadow:    rgba(0,0,0,0.15);
    --marker-stroke: #333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; transition: background 0.25s, color 0.25s; }

  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  #header-h1 { font-size: 15px; font-weight: 600; color: var(--text2); }
  #header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #stats { margin-left: auto; display: flex; gap: 20px; }
  .stat { text-align: right; }
  .stat-val { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 11px; color: var(--muted); }

  /* Toggles row */
  #controls { display: flex; gap: 8px; align-items: center; }

  .toggle-group {
    display: flex;
    gap: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tgl-btn {
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: var(--btn-bg);
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tgl-btn.active { background: var(--btn-active); color: var(--accent); }
  .tgl-btn:not(:last-child) { border-right: 1px solid var(--border); }

  #main { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }

  #sidebar {
    width: 280px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #search {
    width: 100%;
    background: var(--search-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text2);
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
    margin-top: 6px;
    transition: background 0.25s, border-color 0.25s;
  }
  #search:focus { border-color: var(--accent); }
  #list { overflow-y: auto; flex: 1; }
  .row {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border2);
    cursor: pointer;
    transition: background 0.15s;
    gap: 10px;
  }
  .row:hover { background: var(--row-hover); }
  .row.active { background: var(--row-active); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .row-name { font-size: 12px; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-val { font-size: 12px; font-weight: 700; white-space: nowrap; }

  #legend {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg2);
  }
  #legend .leg-title { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; color: var(--text2); }
  .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  .leaflet-popup-content-wrapper {
    background: var(--popup-bg) !important;
    border: 1px solid var(--border) !important;
    color: var(--text2) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 20px var(--shadow) !important;
  }
  .leaflet-popup-tip { background: var(--popup-bg) !important; }
  .popup-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .popup-item .lbl { font-size: 10px; color: var(--muted); }
  .popup-item .val { font-size: 13px; font-weight: 600; }
  .popup-active { font-size: 11px; color: var(--accent); margin-top: 6px; font-weight: 600; }

  .filter-bar {
    display: flex; gap: 6px; padding: 6px 12px; flex-wrap: wrap; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    font-size: 10px; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--btn-bg); color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .filter-btn.on { background: var(--btn-active); color: var(--accent); border-color: var(--accent); }

</style>
</head>

</div>

  document.getElementById('header-sub').innerHTML =
    '110 kV pastotės · ' + mode + ' &gt; ' + currentMin + ' MW · Duomenys: Litgrid / ESO ArcGIS 2026-05-18';
  render();
}

// Init map
const map = L.map('map', { center: [55.3, 23.8], zoom: 7, zoomControl: true });
let tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO', maxZoom: 19
}).addTo(map);

let currentTheme = 'dark';

function setTheme(theme) {
  currentTheme = theme;
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
  document.getElementById('btn-light').classList.toggle('active', theme === 'light');

  map.removeLayer(tileLayer);
  const url = theme === 'light'
    ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(url, { attribution: '© OpenStreetMap © CARTO', maxZoom: 19 }).addTo(map);
}

const markerGroup = L.layerGroup().addTo(map);

function makeMarker(s, i) {
  const val = s[currentMode];
  const col = getColor(val);
  const r = getRadius(val);
  const m = L.circleMarker([s.lat, s.lng], {
    radius: r,
    fillColor: col,
    color: '#fff',
    weight: 1.2,
    fillOpacity: 0.9,
  });
  m.bindPopup(`
    <div class="popup-title">⚡ ${s.name}</div>
    <div class="popup-active">Rodymas: ${currentMode}</div>
    <div class="popup-grid" style="margin-top:6px;">
      <div class="popup-item">
        <div class="lbl">LaisvaSUN1</div>
        <div class="val" style="color:${getColor(s.LaisvaSUN1)}">${s.LaisvaSUN1} MW</div>
      </div>
      <div class="popup-item">
        <div class="lbl">SuN1naktine</div>
        <div class="val" style="color:${getColor(s.SuN1naktine)}">${s.SuN1naktine.toFixed(2)} MW</div>
      </div>
    </div>
  `, { maxWidth: 260 });
  return m;
}

const listEl = document.getElementById('list');
let rowEls = [];

function buildList(data) {
  listEl.innerHTML = '';
  rowEls = [];
  data.forEach((s, i) => {
    const val = s[currentMode];
    const col = getColor(val);
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<div class="dot" style="background:${col}"></div>
      <div class="row-name">${s.name}</div>
      <div class="row-val" style="color:${col}">${val.toFixed(2)}</div>`;
    div.addEventListener('click', () => {
      map.setView([s.lat, s.lng], 11);
      markers[i].openPopup();
      if (activeRow) activeRow.classList.remove('active');
      div.classList.add('active');
      activeRow = div;
    });
    listEl.appendChild(div);
    rowEls.push(div);
  });
}

function render() {
  markerGroup.clearLayers();
  markers = [];
  const filtered = SUBSTATIONS.filter(s =>
    s[currentMode] >= currentMin &&
    s.name.toLowerCase().includes(searchVal)
  );
  // Sort by current mode descending
  filtered.sort((a, b) => b[currentMode] - a[currentMode]);

  filtered.forEach((s, i) => {
    const m = makeMarker(s, i);
    markerGroup.addLayer(m);
    markers.push(m);
  });

  buildList(filtered);

  const total = filtered.reduce((a, s) => a + s[currentMode], 0);
  const mx = filtered.length ? Math.max(...filtered.map(s => s[currentMode])) : 0;
  document.getElementById('stat-count').textContent = filtered.length;
  document.getElementById('stat-max').textContent = mx.toFixed(2);
  document.getElementById('stat-total').textContent = Math.round(total).toLocaleString('lt-LT');

  // Update header sub
  document.getElementById('header-sub').innerHTML =
    '110 kV pastotės · ' + currentMode + ' &gt; ' + currentMin + ' MW · Duomenys: Litgrid / ESO ArcGIS 2026-05-18';
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentMin = parseFloat(btn.dataset.min);
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value.toLowerCase();
  render();
});

render();
</script>
</body>
</html>
