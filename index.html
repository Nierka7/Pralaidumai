<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESO pralaidumai</title>

<!-- Leaflet map library -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- ══════════════════════════════════════════════════════
     NEW: proj4js — converts LKS-94 (EPSG:3346) coords
     from the ArcGIS JSON into WGS-84 (lat/lon) for Leaflet.
     The JSON geometry.x / geometry.y values are in metres
     using the Lithuanian national grid — NOT decimal degrees.
     Without this conversion the markers land in the ocean.
     ══════════════════════════════════════════════════════ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<style>
  /* ── Colour tokens (dark theme default) ─────────────── */
  :root {
    --bg:        #0f1117;
    --bg2:       #161b27;
    --border:    #2a3650;
    --text:      #e0e0e0;
    --text2:     #c8d8f0;
    --muted:     #7a90b0;
    --accent:    #4fc3f7;
    --btn-bg:    #0f1117;
    --btn-active:#1a3050;
    --popup-bg:  #161b27;
    --shadow:    rgba(0,0,0,0.6);
  }
  body.light {
    --bg:        #f0f4f8;
    --bg2:       #ffffff;
    --border:    #c5d3e0;
    --text:      #1a2535;
    --text2:     #1e3050;
    --muted:     #6080a0;
    --accent:    #1a6fa8;
    --btn-bg:    #f0f4f8;
    --btn-active:#cce0f5;
    --popup-bg:  #ffffff;
    --shadow:    rgba(0,0,0,0.15);
  }

  /* ── Base layout ─────────────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
  }

  /* ── Top header ──────────────────────────────────────── */
  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  #header-h1  { font-size: 15px; font-weight: 600; color: var(--text2); }
  #header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .toggle-group {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-left: auto;
  }
  .tgl-btn {
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: var(--btn-bg);
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tgl-btn.active { background: var(--btn-active); color: var(--accent); }
  .tgl-btn:not(:last-child) { border-right: 1px solid var(--border); }

  /* ── Map wrapper + map ───────────────────────────────── */
  #map-wrap { position: relative; flex: 1; }
  #map      { width: 100%; height: 100%; }

  /* ── Loading overlay (shown while JSON is fetching) ─── */
  #loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 17, 23, 0.75);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.5px;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #loading-overlay.hidden { opacity: 0; }

  /* ── Filter panel (floats top-left over map) ─────────── */
  #filter-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: var(--popup-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px 15px;
    box-shadow: 0 4px 20px var(--shadow);
    min-width: 230px;
    transition: background 0.25s, border-color 0.25s;
  }
  #filter-panel .fp-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .filter-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 18px;
  }
  .filter-col h4 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }
  .filter-col label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 7px;
    user-select: none;
    transition: color 0.2s;
  }
  .filter-col label:hover { color: var(--accent); }
  .filter-col input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.25);
  }
  #filter-count {
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    border-top: 1px solid var(--border);
    padding-top: 7px;
  }

  /* ── Leaflet popup custom styling ────────────────────── */
  /*
     NEW: These rules make the popup match the dark/light
     theme instead of using Leaflet's default white box.
  */
  .leaflet-popup-content-wrapper,
  .leaflet-popup-tip {
    background: var(--popup-bg) !important;
    color: var(--text) !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 4px 16px var(--shadow) !important;
    border-radius: 8px !important;
  }
  .leaflet-popup-content {
    margin: 12px 14px !important;
    font-size: 12px;
    line-height: 1.6;
  }
  .popup-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .popup-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .popup-label { color: var(--muted); flex: 1; }
  .popup-value { font-weight: 600; color: var(--text2); white-space: nowrap; }
  .popup-null  { font-weight: 400; color: var(--muted); font-style: italic; }
  .popup-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: var(--btn-active);
    color: var(--accent);
  }
/* ── Capacity slider section ─────────────────────────── */
  #cap-section {
    border-top: 1px solid var(--border);
    margin-top: 10px;
    padding-top: 10px;
  }
  #cap-section .fp-title {
    margin-bottom: 8px;
    margin-top: 0;
  }

  /* Radio buttons for N-1 vs flexible mode */
  .cap-mode-wrap {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 10px;
  }
  .cap-radio {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }
  .cap-radio:hover { color: var(--accent); }
  .cap-radio input[type="radio"] {
    accent-color: var(--accent);
    width: 13px;
    height: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Slider track + label */
  .slider-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #cap-slider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 4px;
  }
  #cap-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<div id="header">
  <div>
    <div id="header-h1">ESO pralaidumai</div>
    <div id="header-sub">35 / 110 kV pastotės · Duomenys: ESO ArcGIS 2026-05-24</div>
  </div>
  <div class="toggle-group">
    <button class="tgl-btn active" id="btn-dark"  onclick="setTheme('dark')">🌑 Tamsi</button>
    <button class="tgl-btn"        id="btn-light" onclick="setTheme('light')">☀ Šviesi</button>
  </div>
</div>

<!-- ── Map area ────────────────────────────────────────── -->
<div id="map-wrap">

  <!-- Loading spinner — hidden once JSON is ready -->
  <div id="loading-overlay">⟳ &nbsp;Kraunami duomenys…</div>

  <!-- Filter panel -->
  <div id="filter-panel">
    <div class="fp-title">Rodyti pastotes</div>

    <div class="filter-columns">
      <!-- ESO column -->
      <div class="filter-col">
        <h4>ESO</h4>
        <label>
          <input type="checkbox" id="f-eso-35"  data-op="ESO" data-v="35"  checked onchange="applyFilters()">
          <span class="dot" style="background:#f59e0b;"></span>
          35 kV
        </label>
        <label>
          <input type="checkbox" id="f-eso-110" data-op="ESO" data-v="110" checked onchange="applyFilters()">
          <span class="dot" style="background:#4fc3f7;"></span>
          110 kV
        </label>
      </div>

      <!-- Litgrid column -->
      <div class="filter-col">
        <h4>Litgrid</h4>
        <label>
          <input type="checkbox" id="f-ltg-110" data-op="Litgrid" data-v="110" checked onchange="applyFilters()">
          <span class="dot" style="background:#34d399;"></span>
          110 kV
        </label>
        <label>
          <input type="checkbox" id="f-ltg-330" data-op="Litgrid" data-v="330" checked onchange="applyFilters()">
          <span class="dot" style="background:#f87171;"></span>
          330 kV
        </label>
      </div>
    </div>

    <div id="filter-count">Kraunama…</div>
       <!-- ── Capacity slider ─────────────────────────────── -->
    <div id="cap-section">

      <div class="fp-title">Galios filtras</div>

      <!-- Which capacity field to compare against the slider -->
      <div class="cap-mode-wrap">
        <!-- <label class="cap-radio">
          <input type="radio" name="cap-mode" value="n1"
                 checked onchange="updateVisibleMarkers()">
          N-1 ribojimas
        </label> -->
        <label class="cap-radio">
          <input type="radio" name="cap-mode" value="flexible"
                 checked onchange="updateVisibleMarkers()">
          LP + N-1 ribojimas
        </label>
      </div>

      <!-- Slider: 0 means "no minimum" (show all) -->
      <div class="slider-wrap">
        <input type="range" id="cap-slider"
               min="0" max="50" step="1" value="0"
               oninput="updateVisibleMarkers()">
        <div id="cap-label">Minimali galia: 0 MW</div>
      </div>

    </div>
  </div>

  <div id="map"></div>
</div>


<script>
/* ═══════════════════════════════════════════════════════════════
   SECTION 1 — COORDINATE SYSTEM DEFINITION
   ═══════════════════════════════════════════════════════════════

   The ArcGIS JSON has spatialReference.wkid = 3346, which is
   LKS-94 — the Lithuanian national coordinate system.
   geometry.x / geometry.y are in METRES, not degrees.

   proj4.defs() registers the projection so we can call
   proj4('EPSG:3346', 'EPSG:4326', [x, y])
   to get back [longitude, latitude] that Leaflet understands.

   If you skip this step, every marker lands somewhere in
   the Atlantic Ocean.
*/
proj4.defs(
  'EPSG:3346',
  '+proj=tmerc +lat_0=0 +lon_0=24 +k=0.9998 ' +
  '+x_0=500000 +y_0=0 +ellps=GRS80 ' +
  '+towgs84=0,0,0,0,0,0,0 +units=m +no_defs'
);

/* Helper: convert one LKS-94 point to Leaflet [lat, lng].
   Returns null if x or y is missing / not a finite number. */
function lks94ToLatLng(x, y) {
  if (x == null || y == null || !isFinite(x) || !isFinite(y)) return null;
  try {
    const [lng, lat] = proj4('EPSG:3346', 'EPSG:4326', [x, y]);
    return [lat, lng];          // Leaflet wants [lat, lng], proj4 returns [lng, lat]
  } catch (e) {
    return null;
  }
}


/* ═══════════════════════════════════════════════════════════════
   SECTION 2 — MAP + TILE LAYER
   ═══════════════════════════════════════════════════════════════ */

const map = L.map('map', { center: [55.3, 23.8], zoom: 7, zoomControl: true });

let tileLayer = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution: '© OpenStreetMap © CARTO', maxZoom: 19 }
).addTo(map);

let currentTheme = 'dark';

function setTheme(theme) {
  currentTheme = theme;
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('btn-dark').classList.toggle('active',  theme === 'dark');
  document.getElementById('btn-light').classList.toggle('active', theme === 'light');
  map.removeLayer(tileLayer);
  const url = theme === 'light'
    ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(url, { attribution: '© OpenStreetMap © CARTO', maxZoom: 19 }).addTo(map);
}


/* ═══════════════════════════════════════════════════════════════
   SECTION 3 — MARKER COLOURS
   ═══════════════════════════════════════════════════════════════

   Keys match the pattern  "operator-voltage"  used by the filter.
   The coloured dots in the HTML filter panel use the same hex values.
*/
const COLOURS = {
  'ESO-35':      { fill: '#f59e0b', border: '#92400e' },   // amber
  'ESO-110':     { fill: '#4fc3f7', border: '#0369a1' },   // sky blue
  'Litgrid-110': { fill: '#34d399', border: '#065f46' },   // emerald
  'Litgrid-330': { fill: '#f87171', border: '#991b1b' },   // rose
};

function colourFor(sub) {
  return COLOURS[sub.operator + '-' + sub.voltage] || { fill: '#aaa', border: '#444' };
}


/* ═══════════════════════════════════════════════════════════════
   SECTION 4 — POPUP HTML BUILDER
   ═══════════════════════════════════════════════════════════════

   Formats a single substation record into a themed popup.
   Handles null / undefined field values gracefully.
*/
function fmt(val) {
  /* Round a number to 2 decimal places; return "—" for null/undefined. */
  if (val == null || !isFinite(val)) {
    return '<span class="popup-null">—</span>';
  }
  return '<span class="popup-value">' + Number(val).toFixed(2) + ' MW</span>';
}

function buildPopupHtml(sub) {
     // ── LITGRID popup fields ─────────────────────────────────────
  // Litgrid markeriai gauna savo išdėstymą; ESO krenta žemiau nepakeistas.
  if (sub.operator === 'Litgrid') {
    const ltgBadge = sub.badge || ('Litgrid · ' + sub.voltage + ' kV');

    // Papildoma informacija: null arba tuščia eilutė → "—"
    const infoHtml = (sub.info != null && String(sub.info).trim() !== '')
      ? '<span class="popup-value" style="white-space:normal;">' + sub.info + '</span>'
      : '<span class="popup-null">—</span>';

    return (
      '<div class="popup-name">' + (sub.name || 'Nenurodyta') + '</div>' +

      '<div class="popup-row">' +
        '<span class="popup-label">Pastotės pavadinimas</span>' +
        '<span class="popup-value">' + (sub.name || '—') + '</span>' +
      '</div>' +

      '<div class="popup-row">' +
        '<span class="popup-label">Įtampa</span>' +
        '<span class="popup-value">' + sub.voltage + ' kV</span>' +
      '</div>' +

      '<div class="popup-row">' +
        '<span class="popup-label">Laisva prijungimo galia LITGRID tinkle SE, MW</span>' +
        fmt(sub.seCapacity) +
      '</div>' +

      '<div class="popup-row">' +
        '<span class="popup-label">Laisva prijungimo galia LITGRID tinkle VE, MW</span>' +
        fmt(sub.veCapacity) +
      '</div>' +

      '<div class="popup-row">' +
        '<span class="popup-label">Laisva prijungimo galia LITGRID tinkle EEKĮ generavimui / kaupikliams, MW</span>' +
        fmt(sub.storageCapacity) +
      '</div>' +

      '<div class="popup-row">' +
        '<span class="popup-label">Papildoma informacija</span>' +
        infoHtml +
      '</div>' +

      '<div><span class="popup-badge">' + ltgBadge + '</span></div>'
    );
  }
  // ── end Litgrid branch ───────────────────────────────────────
     
  // badge falls back to "operator · voltage kV" if not set explicitly
  const badge = sub.badge || (sub.operator + ' · ' + sub.voltage + ' kV');

  return (
    '<div class="popup-name">' + (sub.name || 'Nenurodyta') + '</div>' +

    '<div class="popup-row">' +
      '<span class="popup-label">Pastotės pavadinimas</span>' +
      '<span class="popup-value">' + (sub.name || '—') + '</span>' +
    '</div>' +

    '<div class="popup-row">' +
      '<span class="popup-label">Laisva galia taikant N-1 ribojimus, MW</span>' +
      fmt(sub.laisva_surib) +
    '</div>' +

    '<div class="popup-row">' +
      '<span class="popup-label">Laisva galia taikant lanksčiojo prijungimo ir N-1 ribojimus, MW</span>' +
      fmt(sub.laisva_lp_n1) +
    '</div>' +

    '<div class="popup-row">' +
  '<span class="popup-label">LITGRID Ruožo laisva galia EEKĮ prijungimui su sistemos balanso ribojimu, MW</span>' +
  (sub.laisva_eeki != null
    ? '<span class="popup-value">' + sub.laisva_eeki.toFixed(2) + ' MW</span>'
    : '<span class="popup-null">Nėra duomenų</span>') +
'</div>' +

       '<div class="popup-row">' +
  '<span class="popup-label">Rekonstrukcijos įgyvendinimo data</span>' +
  (sub.rekon_data != null
    ? '<span class="popup-value">' + sub.rekon_data + '</span>'
    : '<span class="popup-null">Nėra duomenų</span>') +
'</div>' +
       
'<div><span class="popup-badge">' + badge + '</span></div>'
  );
}


/* ═══════════════════════════════════════════════════════════════
   SECTION 5 — MARKERS ARRAY + BUILD FUNCTION
   ═══════════════════════════════════════════════════════════════

   `markers` holds every marker object in the format:
     { data: { operator, voltage, name, lat, lng, … },
       layer: <Leaflet CircleMarker> }

   This is the same structure used by applyFilters() below,
   so markers from JSON and any manually-added markers all
   work with the same filter checkbox logic.
*/
const markers = [];

function addMarkersToMap(substationList) {
  substationList.forEach(function(sub) {
    const c = colourFor(sub);

    const layer = L.circleMarker([sub.lat, sub.lng], {
      radius:      6,
      fillColor:   c.fill,
      color:       c.border,
      weight:      1.5,
      opacity:     1,
      fillOpacity: 0.85,
    });

    layer.bindPopup(buildPopupHtml(sub), { maxWidth: 280 });

    layer.addTo(map);
    markers.push({ data: sub, layer: layer });
  });
}


/* ═══════════════════════════════════════════════════════════════
   SECTION 6 — FILTER LOGIC
   ═══════════════════════════════════════════════════════════════

   Two functions:

   applyFilters()           — keeps the original name so the HTML
                              checkbox onchange attributes work
                              without any change. It simply
                              delegates to updateVisibleMarkers().

   updateVisibleMarkers()   — the single source of truth for what
                              is visible on the map. Applies both:
                                • substation group checkboxes
                                • capacity slider + mode selector

   HOW THE CAPACITY FIELDS WERE MAPPED AT LOAD TIME
   ─────────────────────────────────────────────────
   Each loader normalises raw JSON field names into two standard
   properties on every sub object:

     sub.laisva_surib   ← "available under N-1 restrictions"
     sub.laisva_lp_n1   ← "available under flexible + N-1"

   Source mapping per group:
     ESO-35 :
       laisva_surib  ← Laisva_galia_35110_surib
       laisva_lp_n1  ← TPlanksti_laisvaN1
     ESO-110 :
       laisva_surib  ← LaisvaSUN1
       laisva_lp_n1  ← SuN1naktine
     Litgrid-110 :
       laisva_surib  ← PUT_CORRECT_FIELD_HERE  (fill when you add the loader)
       laisva_lp_n1  ← PUT_CORRECT_FIELD_HERE
     Litgrid-330 :
       laisva_surib  ← PUT_CORRECT_FIELD_HERE
       laisva_lp_n1  ← PUT_CORRECT_FIELD_HERE

   Because the mapping happens in the loader, this function only
   ever reads sub.laisva_surib and sub.laisva_lp_n1 — it never
   needs to know the original raw field names.
*/

/* ── Thin wrapper — keeps HTML onchange="applyFilters()" working ── */
function applyFilters() {
  updateVisibleMarkers();
}

/* ── Master visibility function ──────────────────────────────────── */
function updateVisibleMarkers() {

  /* Step A — which substation groups are checked? */
  const activeGroups = new Set();
  document.querySelectorAll('#filter-panel input[type="checkbox"]').forEach(function(cb) {
    if (cb.checked) {
      activeGroups.add(cb.dataset.op + '-' + cb.dataset.v);
    }
  });

  /* Step B — read slider value (0 = no minimum, show everything) */
  const sliderEl = document.getElementById('cap-slider');
  const minMW    = sliderEl ? parseFloat(sliderEl.value) : 0;

  /* Step C — read capacity mode (n1 or flexible) */
  const modeEl = document.querySelector('input[name="cap-mode"]:checked');
  const mode   = modeEl ? modeEl.value : 'flexible';   // safe default

  /* Step D — update the label next to the slider */
  const labelEl = document.getElementById('cap-label');
  if (labelEl) {
    labelEl.textContent = minMW === 0
      ? 'Minimali galia: nėra apribojimo'
      : 'Minimali galia: ' + minMW.toFixed(0) + ' MW';
  }

  /* Step E — show or hide each marker */
  let visible = 0;

  markers.forEach(function(m) {
    const key = m.data.operator + '-' + m.data.voltage;

    /* Rule 1: group must be checked */
    const groupPass = activeGroups.has(key);

    /* Rule 2: capacity must meet the minimum
         - If slider is at 0, every marker passes regardless.
         - If slider > 0 and the field is null (no data), the
           marker is hidden — we cannot confirm it meets the limit.
         - Otherwise, the stored value must be >= the slider.         */
    let capPass;
    if (minMW === 0) {
      capPass = true;                           // slider at zero → no filter
    } else {
      const capVal = mode === 'n1'
        ? m.data.laisva_surib   // N-1 mode
        : m.data.laisva_lp_n1; // flexible + N-1 mode

      capPass = (capVal !== null && capVal !== undefined && capVal >= minMW);
    }

    /* Show only when BOTH rules pass */
    if (groupPass && capPass) {
      if (!map.hasLayer(m.layer)) m.layer.addTo(map);
      visible++;
    } else {
      if (map.hasLayer(m.layer)) map.removeLayer(m.layer);
    }
  });

  /* Step F — update the marker counter */
  document.getElementById('filter-count').textContent =
    'Rodoma ' + visible + ' iš ' + markers.length;
}


/* ═══════════════════════════════════════════════════════════════
   SECTION 7 — LOAD DATA FROM JSON FILE
   ═══════════════════════════════════════════════════════════════

   IMPORTANT — FILE PATH AND SPACES:
   ─────────────────────────────────
   Your file is named  "35 kV.json"  (with a space).
   GitHub Pages serves files with spaces fine, but fetch()
   needs the space URL-encoded as %20.

   Best practice: rename the file to "35kV.json" (no space)
   and change the path below to match. Spaces in filenames
   cause subtle bugs in some tools.

   Current path used here:  'Data/35%20kV.json'
   If you rename to 35kV.json, change to: 'Data/35kV.json'
*/
async function loadESO35kV() {
  const overlay = document.getElementById('loading-overlay');
  const counter = document.getElementById('filter-count');

  try {
    /* ── 1. Fetch the file ─────────────────────────────── */
    const response = await fetch('Data/35%20kV.json');

    if (!response.ok) {
      /* HTTP error (404 Not Found, 403 Forbidden, etc.) */
      throw new Error(
        'Serverio klaida ' + response.status + ': ' + response.statusText + '\n' +
        'Patikrinkite, ar failas yra kelyje  Data/35 kV.json'
      );
    }

    const json = await response.json();

    /* ── 2. Validate the JSON structure ────────────────── */
    if (!json.features || !Array.isArray(json.features)) {
      throw new Error('JSON formatas neteisingas: trūksta "features" masyvo.');
    }

    /* ── 3. Parse each feature ─────────────────────────── */
    let skipped = 0;
    const substationList = [];

    json.features.forEach(function(feature, index) {
      const attr = feature.attributes || {};
      const geom = feature.geometry  || {};

      /* Skip records with missing or invalid coordinates */
      const latLng = lks94ToLatLng(geom.x, geom.y);
      if (!latLng) {
        skipped++;
        console.warn('Praleista pastotė (trūksta koordinačių), eilutė:', index, attr.nameproduct);
        return;   /* continue to next feature */
      }

      substationList.push({
        /* Fields required by the filter + colour system */
        operator: 'ESO',
        voltage:  '35',
        lat:      latLng[0],
        lng:      latLng[1],

        /* Display fields */
        name:         attr.nameproduct          || null,

        /*
          Laisva galia taikant N-1 ribojimus, MW
          Field: Laisva_galia_35110_surib
        */
        laisva_surib: attr.Laisva_galia_35110_surib != null
                        ? Number(attr.Laisva_galia_35110_surib)
                        : null,

        /*
          Laisva galia taikant lanksčiojo prijungimo ir N-1 ribojimus, MW
          Field: TPlanksti_laisvaN1
        */
        laisva_lp_n1: attr.TPlanksti_laisvaN1 != null
                        ? Number(attr.TPlanksti_laisvaN1)
                        : null,

           laisva_eeki: (attr['Laisva_galia_EKĮ_viršbalansinė'] != null &&
                        isFinite(attr['Laisva_galia_EKĮ_viršbalansinė']))
                         ? Number(attr['Laisva_galia_EKĮ_viršbalansinė'])
                         : null,
           
             // NEW: reconstruction date for ESO 35 kV
            rekon_data: (attr.PoR_data != null && attr.PoR_data !== '')
                          ? attr.PoR_data
                          : null,
          badge: 'ESO · 35 kV',
      });
    });

    /* ── 4. Place markers on the map ───────────────────── */
    addMarkersToMap(substationList);

    /* ── 5. Run filter to sync checkboxes with markers ─── */
    applyFilters();

    /* ── 6. Log any skipped records ────────────────────── */
    if (skipped > 0) {
      console.warn('Praleista iš viso:', skipped, 'pastočių dėl trūkstamų koordinačių.');
    }
    console.log('Įkelta ESO 35 kV pastočių:', substationList.length);

  } catch (err) {
    /* ── Error handling ────────────────────────────────── */
    console.error('Klaida įkeliant duomenis:', err);

    counter.textContent = '⚠ Klaida įkeliant duomenis';
    counter.style.color = '#f87171';

    /* Show a map-level alert so the user sees the problem */
    const errorMsg = L.popup({ className: 'error-popup', maxWidth: 340 })
      .setLatLng([55.3, 23.8])
      .setContent(
        '<b style="color:#f87171">⚠ Klaida įkeliant duomenis</b><br><br>' +
        '<code style="font-size:11px;word-break:break-all">' + err.message + '</code><br><br>' +
        '<span style="font-size:11px;color:#aaa">Patikrinkite, ar failas yra: <b>Data/35 kV.json</b></span>'
      )
      .openOn(map);
  } finally {
    /* Always hide the loading overlay */
    overlay.classList.add('hidden');
    setTimeout(function() { overlay.style.display = 'none'; }, 350);
  }
}

async function loadLitgrid() {

/* ═══════════════════════════════════════════════════════════════
   SECTION 9 — LOAD ESO 110 kV DATA (THREE FILES, MERGED)
   ═══════════════════════════════════════════════════════════════

   The three source files cover different substation categories:
     • ESO_yra_Litgrid_nera.json  — ESO substation exists, Litgrid link missing
     • ESO_nevaldoma.json          — uncontrolled ESO substations
     • ESO_yra_Litgrid_yra.json   — both ESO and Litgrid links present

   All three share the same field schema, so we can merge them
   without any special-casing.

   If you kept the original spaced filenames, replace the paths
   below with the %20-encoded versions listed in the comment at
   the end of this function.
*/
async function loadESO110kV() {
  const files = [
    'Data/ESO_yra_Litgrid_nera.json',
    'Data/ESO_nevaldoma.json',
    'Data/ESO_yra_Litgrid_yra.json',
  ];

  try {
    /* ── 1. Fetch all three files at the same time ──────── */
    const responses = await Promise.all(files.map(function(path) {
      return fetch(path);
    }));

    /* ── 2. Check every response for HTTP errors ────────── */
    responses.forEach(function(r, i) {
      if (!r.ok) {
        throw new Error(
          'Nepavyko įkelti failo: ' + files[i] +
          '\nServerio atsakas: ' + r.status + ' ' + r.statusText
        );
      }
    });

    /* ── 3. Parse JSON from all three responses ─────────── */
    const jsons = await Promise.all(responses.map(function(r) {
      return r.json();
    }));

    /* ── 4. Validate and merge the "features" arrays ─────── */
    jsons.forEach(function(json, i) {
      if (!json.features || !Array.isArray(json.features)) {
        throw new Error(
          'JSON formatas neteisingas faile: ' + files[i] +
          '\nTrūksta "features" masyvo.'
        );
      }
    });

    /* flatMap merges [ [f,f,f], [f,f], [f,f,f,f] ] into one array */
    const allFeatures = jsons.flatMap(function(json) {
      return json.features;
    });

    /* ── 5. Parse each feature into a substation object ──── */
    let skipped = 0;
    const substationList = [];

    allFeatures.forEach(function(feature, index) {
      const attr = feature.attributes || {};
      const geom = feature.geometry   || {};

      /* Skip if coordinates are missing or non-numeric */
      const latLng = lks94ToLatLng(geom.x, geom.y);
      if (!latLng) {
        skipped++;
        console.warn(
          'ESO 110 kV — praleista pastotė (trūksta koordinačių), ' +
          'eilutė ' + index + ':', attr.PAS_PAVADINIMAS
        );
        return; /* continue to next feature */
      }

      substationList.push({
        /* Required by the filter + colour system */
        operator: 'ESO',
        voltage:  '110',
        lat:      latLng[0],
        lng:      latLng[1],

        /* Display fields */
        name: attr.PAS_PAVADINIMAS || null,

        /*
          LaisvaSUN1    — available capacity under N-1 restrictions, MW
          SuN1naktine   — available capacity under flexible
                          connection + N-1 restrictions, MW
          Both can be null if the field is absent or not a number.
        */
        laisva_surib: (attr.LaisvaSUN1 != null && isFinite(attr.LaisvaSUN1))
                        ? Number(attr.LaisvaSUN1)
                        : null,

        laisva_lp_n1: (attr.SuN1naktine != null && isFinite(attr.SuN1naktine))
                        ? Number(attr.SuN1naktine)
                        : null,
          laisva_eeki: (attr.LaisvaEEKI != null && isFinite(attr.LaisvaEEKI))
                         ? Number(attr.LaisvaEEKI)
                         : null,
           rekon_data: (attr.INV_metai != null && attr.INV_metai !== '')
                ? attr.INV_metai
                : null,
        badge: 'ESO · 110 kV',
      });
    });

    /* ── 6. Add markers and sync filters ─────────────────── */
    addMarkersToMap(substationList);
    applyFilters();   /* refreshes the visible-marker counter */

    console.log('Įkelta ESO 110 kV pastočių iš viso:', substationList.length,
                '(iš', allFeatures.length, 'objektų,', skipped, 'praleista)');

  } catch (err) {
    /* One file failing does not crash the entire map —
       the 35 kV layer and any already-loaded 110 kV markers stay visible. */
    console.error('Klaida įkeliant ESO 110 kV duomenis:', err);

    /* Show a non-blocking warning on the map */
    L.popup({ maxWidth: 360 })
      .setLatLng([55.3, 23.8])
      .setContent(
        '<b style="color:#f87171">⚠ ESO 110 kV duomenys neįkelti</b><br><br>' +
        '<code style="font-size:11px;word-break:break-all">' + err.message + '</code><br><br>' +
        '<span style="font-size:11px;color:#aaa">' +
          'Patikrinkite failo pavadinimus aplanke <b>Data/</b>' +
        '</span>'
      )
      .openOn(map);
  }
}
