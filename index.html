<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laisvos vėjo elektrinių pajungimo galios – 110 kV pastotės</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg:        #0f1117;
    --bg2:       #161b27;
    --border:    #2a3650;
    --text:      #e0e0e0;
    --text2:     #c8d8f0;
    --muted:     #7a90b0;
    --accent:    #4fc3f7;
    --btn-bg:    #0f1117;
    --btn-active:#1a3050;
    --popup-bg:  #161b27;
    --shadow:    rgba(0,0,0,0.6);
  }
  body.light {
    --bg:        #f0f4f8;
    --bg2:       #ffffff;
    --border:    #c5d3e0;
    --text:      #1a2535;
    --text2:     #1e3050;
    --muted:     #6080a0;
    --accent:    #1a6fa8;
    --btn-bg:    #f0f4f8;
    --btn-active:#cce0f5;
    --popup-bg:  #ffffff;
    --shadow:    rgba(0,0,0,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; transition: background 0.25s, color 0.25s; }

  #header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  #header-h1 { font-size: 15px; font-weight: 600; color: var(--text2); }
  #header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .toggle-group {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-left: auto;
  }
  .tgl-btn {
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: var(--btn-bg);
    color: var(--muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tgl-btn.active { background: var(--btn-active); color: var(--accent); }
  .tgl-btn:not(:last-child) { border-right: 1px solid var(--border); }

  #map { flex: 1; }
</style>
</head>
<body>

<div id="header">
  <div>
    <div id="header-h1">⚡ Laisvos vėjo elektrinių prisijungimo galios</div>
    <div id="header-sub">110 kV pastotės · Duomenys: Litgrid / ESO ArcGIS 2026-05-18</div>
  </div>
  <div class="toggle-group">
    <button class="tgl-btn active" id="btn-dark" onclick="setTheme('dark')">🌑 Tamsi</button>
    <button class="tgl-btn" id="btn-light" onclick="setTheme('light')">☀ Šviesi</button>
  </div>
</div>

<div id="map"></div>

<script>
const map = L.map('map', { center: [55.3, 23.8], zoom: 7, zoomControl: true });
let tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO', maxZoom: 19
}).addTo(map);

let currentTheme = 'dark';

function setTheme(theme) {
  currentTheme = theme;
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('btn-dark').classList.toggle('active', theme === 'dark');
  document.getElementById('btn-light').classList.toggle('active', theme === 'light');
  map.removeLayer(tileLayer);
  const url = theme === 'light'
    ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
  tileLayer = L.tileLayer(url, { attribution: '© OpenStreetMap © CARTO', maxZoom: 19 }).addTo(map);
}
</script>
</body>
</html>
